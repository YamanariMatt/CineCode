<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineCode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/modal.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <canvas id="particles-canvas"></canvas>

  <header class="navbar" id="navbar">
    <div class="navbar__inner">
      <a class="navbar__logo" href="#" onclick="App.navigate('home'); return false;">
        <div class="navbar__logo-hex">
          <svg width="32" height="32" viewBox="0 0 32 32">
            <polygon points="16,2 29,9.5 29,22.5 16,30 3,22.5 3,9.5" fill="none" stroke="#f2c45a" stroke-width="1.5"/>
            <polygon points="16,8 23,12 23,20 16,24 9,20 9,12" fill="#f2c45a" opacity="0.12"/>
            <circle cx="16" cy="16" r="3.5" fill="#f2c45a"/>
          </svg>
        </div>
        <span class="navbar__logo-text">CINECODE</span>
      </a>

      <nav class="navbar__nav">
        <button class="nav-btn active" data-tab="home"      onclick="App.navigate('home')">🏠 Início</button>
        <button class="nav-btn"        data-tab="search"    onclick="App.navigate('search')">🔍 Buscar</button>
        <button class="nav-btn"        data-tab="artists"   onclick="App.navigate('artists')">🎭 Artistas</button>
        <button class="nav-btn"        data-tab="favorites" onclick="App.navigate('favorites')">
          ❤ Favoritos
          <span class="fav-badge" id="fav-badge" style="display:none">0</span>
        </button>
      </nav>

      <div class="navbar__right">
        <span class="api-dot"></span>
        <span class="api-label">OMDb API</span>
      </div>
    </div>
  </header>

  <section class="hero" id="hero">
    <div class="hero__bg"></div>
    <div class="hero__grid-overlay"></div>
    <div class="hero__content">
      <p class="hero__eyebrow"><span class="hero__eyebrow-pulse"></span>Sua cinemateca pessoal</p>
      <h1 class="hero__title">
        <span class="hero__word" style="--d:0ms">Descubra</span>
        <span class="hero__word hero__word--gold" style="--d:120ms">filmes</span>
        <span class="hero__word" style="--d:240ms">&amp;</span>
        <span class="hero__word hero__word--gold" style="--d:360ms">artistas</span>
      </h1>
      <div class="search-bar" id="search-bar">
        <span class="search-bar__icon">⌕</span>
        <input type="text" id="search-input" class="search-bar__input"
          placeholder="Título, diretor, ator..." autocomplete="off"
          oninput="App.handleSearch(this.value)" />
        <div class="search-bar__tabs">
          <button class="sbar-tab active" id="stab-movie"   onclick="App.setSearchMode('movie',this)">Filmes</button>
          <button class="sbar-tab"        id="stab-person"  onclick="App.setSearchMode('person',this)">Artistas</button>
        </div>
        <button class="search-bar__clear" id="search-clear" onclick="App.clearSearch()">✕</button>
      </div>
    </div>
  </section>

  <main class="main" id="main">

    <div class="view active" id="view-home">
      <div class="view__inner" id="categories-container"></div>
    </div>

    <div class="view" id="view-search">
      <div class="view__inner">
        <div id="search-status" class="search-status"></div>
        <div class="movie-grid" id="search-grid"></div>
        <div class="load-more-wrap" id="load-more-wrap" style="display:none">
          <button class="btn-load-more" onclick="App.loadMore()">Carregar mais</button>
        </div>
      </div>
    </div>

    <div class="view" id="view-artists">
      <div class="view__inner">
        <div class="page-header">
          <h2 class="page-title">🎭 Artistas</h2>
          <p class="page-subtitle">Pesquise atores, atrizes, diretores e roteiristas</p>
        </div>
        <div class="artist-search-bar">
          <span class="search-bar__icon">⌕</span>
          <input type="text" id="artist-input" class="search-bar__input"
            placeholder="Nome do artista..." autocomplete="off"
            oninput="Artists.handleSearch(this.value)" />
          <button class="search-bar__clear" id="artist-clear"
            onclick="Artists.clear()" style="display:none">✕</button>
        </div>
        <div id="artist-status" class="search-status"></div>
        <div id="artist-results"></div>
        <div id="artists-featured"></div>
      </div>
    </div>

    <div class="view" id="view-favorites">
      <div class="view__inner">
        <div class="page-header">
          <h2 class="page-title">❤ Meus Favoritos</h2>
          <span class="section-count" id="fav-count-label"></span>
        </div>
        <div class="movie-grid" id="favorites-grid"></div>
        <div class="empty-state" id="fav-empty" style="display:none">
          <div class="empty-state__icon">🍿</div>
          <p class="empty-state__text">Nenhum favorito ainda.<br/>Explore e clique em ♥ para salvar.</p>
        </div>
      </div>
    </div>

  </main>

  <div class="modal-overlay" id="modal-overlay" onclick="Modal.close()">
    <div class="modal" id="modal" onclick="event.stopPropagation()">
      <button class="modal__close" onclick="Modal.close()">✕</button>
      <div class="modal__body" id="modal-body">
        <div class="modal__loader"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="artist-modal-overlay" onclick="ArtistModal.close()">
    <div class="modal modal--wide" id="artist-modal" onclick="event.stopPropagation()">
      <button class="modal__close" onclick="ArtistModal.close()">✕</button>
      <div class="modal__body" id="artist-modal-body">
        <div class="modal__loader"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/render.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/artists.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
